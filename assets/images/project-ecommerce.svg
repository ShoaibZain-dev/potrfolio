<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142A" />
      <stop offset="50%" stop-color="#0E2145" />
      <stop offset="100%" stop-color="#040A17" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="ecomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ecomBg)" />
  <circle cx="140" cy="100" r="160" fill="#0066FF" opacity="0.1" filter="url(#ecomGlow)" />

  <g transform="translate(100, 45)">
    <!-- Desktop Showcase Window -->
    <rect width="600" height="380" rx="14" fill="#071020" stroke="#162D55" stroke-width="1.5" filter="url(#ecomGlow)" />
    <!-- Nav Bar -->
    <rect width="600" height="42" rx="14" fill="#0B172E" />
    <text x="30" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="2">VELVET THREADS</text>
    <text x="360" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A0B5D6">Men</text>
    <text x="410" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A0B5D6">Women</text>
    <text x="475" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A0B5D6">Summer '26</text>
    <circle cx="560" cy="21" r="12" fill="#0066FF" />
    <text x="556" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">3</text>

    <!-- Hero Banner Inside Store -->
    <g transform="translate(24, 60)">
      <rect width="552" height="130" rx="10" fill="#112242" />
      <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Eastern Elegance &amp; Modern Cut</text>
      <text x="30" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8FA6CC">Handcrafted luxury fabrics with seamless doorstep delivery across Pakistan.</text>
      <rect x="30" y="92" width="115" height="26" rx="6" fill="url(#accentGrad)" />
      <text x="46" y="109" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Shop Collection</text>
    </g>

    <!-- Product Cards Row -->
    <g transform="translate(24, 208)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="170" height="150" rx="10" fill="#0A162B" stroke="#162D55" stroke-width="1" />
      <rect x="0" y="0" width="170" height="85" rx="10" fill="#13274D" />
      <!-- Product visual -->
      <rect x="50" y="15" width="70" height="55" rx="4" fill="#00D2FF" opacity="0.4" />
      <text x="14" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Raw Silk Kurta Navy</text>
      <text x="14" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#00D2FF">PKR 6,499</text>

      <!-- Card 2 -->
      <rect x="191" y="0" width="170" height="150" rx="10" fill="#0A162B" stroke="#162D55" stroke-width="1" />
      <rect x="191" y="0" width="170" height="85" rx="10" fill="#13274D" />
      <rect x="241" y="15" width="70" height="55" rx="4" fill="#0066FF" opacity="0.4" />
      <text x="205" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Embroidered Festive Set</text>
      <text x="205" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#00D2FF">PKR 12,999</text>

      <!-- Card 3 -->
      <rect x="382" y="0" width="170" height="150" rx="10" fill="#0A162B" stroke="#162D55" stroke-width="1" />
      <rect x="382" y="0" width="170" height="85" rx="10" fill="#13274D" />
      <rect x="432" y="15" width="70" height="55" rx="4" fill="#E2A77A" opacity="0.4" />
      <text x="396" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Classic Linen Waistcoat</text>
      <text x="396" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#00D2FF">PKR 4,850</text>
    </g>
  </g>
</svg>
