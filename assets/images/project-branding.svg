<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0A1E3F" />
      <stop offset="100%" stop-color="#040A17" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162A50" />
      <stop offset="100%" stop-color="#0D1A33" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0044BB" />
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p1Bg)" />
  <!-- Abstract Design Shapes -->
  <circle cx="200" cy="150" r="220" fill="#0066FF" opacity="0.12" filter="url(#p1Glow)" />
  <circle cx="650" cy="380" r="180" fill="#00D2FF" opacity="0.1" filter="url(#p1Glow)" />

  <!-- Stationery Mockup - Main Board -->
  <g transform="translate(100, 60)">
    <!-- Business Card 1 Front -->
    <rect x="50" y="40" width="280" height="170" rx="12" fill="url(#cardGrad)" stroke="#00D2FF" stroke-width="1.5" filter="url(#p1Glow)" />
    <!-- Monogram on Card -->
    <circle cx="100" cy="100" r="28" fill="#061022" stroke="#00D2FF" stroke-width="2" />
    <path d="M92 92 C92 88 108 88 108 96 C108 104 92 104 92 112 C92 116 108 116 108 112" fill="none" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
    <text x="145" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">LUMINA</text>
    <text x="145" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#00D2FF" letter-spacing="2">COFFEE ROASTERS</text>
    <line x1="50" y1="170" x2="330" y2="170" stroke="#1F3968" stroke-width="1" />
    <text x="70" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8FA6CC">Crafted Coffee &amp; Artisan Pastries</text>

    <!-- Business Card 2 Back (Angled) -->
    <g transform="translate(220, 160) rotate(-8)">
      <rect width="270" height="160" rx="12" fill="#061226" stroke="#0066FF" stroke-width="1.5" />
      <circle cx="135" cy="80" r="36" fill="url(#goldGrad)" opacity="0.2" />
      <circle cx="135" cy="80" r="26" fill="#061226" stroke="#00D2FF" stroke-width="2" />
      <text x="135" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#00D2FF" text-anchor="middle">L</text>
      <text x="135" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AUTHENTIC BLENDS</text>
    </g>

    <!-- Branding Color Palette Swatches -->
    <g transform="translate(50, 260)">
      <rect width="280" height="90" rx="12" fill="#0B172E" stroke="#1D335E" stroke-width="1" />
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Brand Color Identity</text>
      <!-- Swatch circles -->
      <circle cx="35" cy="60" r="16" fill="#060E20" stroke="#00D2FF" stroke-width="1" />
      <circle cx="80" cy="60" r="16" fill="#0066FF" />
      <circle cx="125" cy="60" r="16" fill="#00D2FF" />
      <circle cx="170" cy="60" r="16" fill="#E2A77A" />
      <circle cx="215" cy="60" r="16" fill="#F4F8FC" />
    </g>

    <!-- Mobile App Icon / Tag Mockup -->
    <g transform="translate(420, 40)">
      <rect width="180" height="180" rx="36" fill="#0A1935" stroke="#00D2FF" stroke-width="2" filter="url(#p1Glow)" />
      <circle cx="90" cy="90" r="50" fill="url(#goldGrad)" />
      <path d="M78 76 C78 70 102 70 102 82 C102 94 78 94 78 106 C78 112 102 112 102 106" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
