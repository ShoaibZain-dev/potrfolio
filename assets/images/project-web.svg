<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E20" />
      <stop offset="50%" stop-color="#0A1838" />
      <stop offset="100%" stop-color="#050C1B" />
    </linearGradient>
    <linearGradient id="browserHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102042" />
      <stop offset="100%" stop-color="#0B162E" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p2Bg)" />
  <circle cx="680" cy="120" r="160" fill="#0066FF" opacity="0.15" filter="url(#p2Glow)" />
  <circle cx="100" cy="400" r="200" fill="#00D2FF" opacity="0.1" filter="url(#p2Glow)" />

  <!-- Laptop / Browser Device Mockup -->
  <g transform="translate(80, 40)">
    <!-- Browser Outer Window -->
    <rect width="640" height="390" rx="16" fill="#0A152E" stroke="#1F3968" stroke-width="2" filter="url(#p2Glow)" />
    <!-- Browser Top Bar -->
    <path d="M0 16 C0 7 7 0 16 0 L624 0 C633 0 640 7 640 16 L640 42 L0 42 Z" fill="url(#browserHeader)" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="42" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="60" cy="21" r="5" fill="#27C93F" />
    <!-- URL Bar -->
    <rect x="100" y="10" width="340" height="22" rx="6" fill="#060E20" stroke="#1D335E" stroke-width="1" />
    <text x="120" y="25" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#758EB8">https://apex-realestate.pk</text>

    <!-- Website Content Inside Browser -->
    <g transform="translate(24, 60)">
      <!-- Mini Nav -->
      <rect width="592" height="32" rx="6" fill="#0D1D3E" />
      <text x="20" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#00D2FF">APEX ESTATE</text>
      <text x="350" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8FA6CC">Properties</text>
      <text x="420" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8FA6CC">Developments</text>
      <text x="500" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8FA6CC">Contact</text>
      <rect x="548" y="6" width="36" height="20" rx="4" fill="#0066FF" />

      <!-- Hero Section inside Website -->
      <rect y="44" width="592" height="150" rx="10" fill="#12254C" />
      <text x="25" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Find Your Dream Property in Jhelum</text>
      <text x="25" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A3BADB">Verified commercial &amp; residential listings with 3D virtual tours.</text>
      
      <!-- Search Filter Bar Inside Mockup -->
      <rect x="25" y="120" width="380" height="42" rx="8" fill="#0A152D" stroke="#00D2FF" stroke-width="1" />
      <text x="40" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#758EB8">Location (Citi Housing, Model Town...)</text>
      <rect x="315" y="126" width="80" height="30" rx="6" fill="url(#blueCard)" />
      <text x="335" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Search</text>

      <!-- Building Graphic on Right of Hero -->
      <g transform="translate(440, 55)">
        <rect x="30" y="30" width="40" height="90" rx="3" fill="#1C3870" />
        <rect x="75" y="10" width="50" height="110" rx="3" fill="#24488A" />
        <!-- Windows -->
        <rect x="85" y="25" width="8" height="12" fill="#00D2FF" opacity="0.8" />
        <rect x="105" y="25" width="8" height="12" fill="#00D2FF" opacity="0.8" />
        <rect x="85" y="45" width="8" height="12" fill="#00D2FF" opacity="0.8" />
        <rect x="105" y="45" width="8" height="12" fill="#00D2FF" opacity="0.8" />
      </g>

      <!-- 3 Property Cards Grid Inside Mockup -->
      <g transform="translate(0, 206)">
        <rect x="0" y="0" width="185" height="105" rx="8" fill="#0D1C3B" stroke="#1B325A" stroke-width="1" />
        <rect x="0" y="0" width="185" height="55" rx="8" fill="#1B3363" />
        <text x="12" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Citi Housing Modern Villa</text>
        <text x="12" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">PKR 2.45 Crore</text>

        <rect x="203" y="0" width="185" height="105" rx="8" fill="#0D1C3B" stroke="#1B325A" stroke-width="1" />
        <rect x="203" y="0" width="185" height="55" rx="8" fill="#1B3363" />
        <text x="215" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Commercial Plaza Main GT Rd</text>
        <text x="215" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">PKR 5.80 Crore</text>

        <rect x="406" y="0" width="185" height="105" rx="8" fill="#0D1C3B" stroke="#1B325A" stroke-width="1" />
        <rect x="406" y="0" width="185" height="55" rx="8" fill="#1B3363" />
        <text x="418" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">River View Luxury Apartment</text>
        <text x="418" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">PKR 1.20 Crore</text>
      </g>
    </g>
  </g>
</svg>
