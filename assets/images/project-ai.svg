<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1D" />
      <stop offset="50%" stop-color="#091833" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)" />

  <!-- Abstract Neural Grid Backdrop -->
  <g stroke="#00D2FF" stroke-width="1" opacity="0.12">
    <line x1="80" y1="120" x2="240" y2="180" />
    <line x1="240" y1="180" x2="400" y2="140" />
    <line x1="400" y1="140" x2="560" y2="220" />
    <line x1="560" y1="220" x2="720" y2="160" />
    <line x1="240" y1="180" x2="320" y2="340" />
    <line x1="400" y1="140" x2="480" y2="360" />
    <line x1="320" y1="340" x2="480" y2="360" />
  </g>

  <!-- Dashboard Container -->
  <g transform="translate(80, 50)">
    <rect width="640" height="380" rx="16" fill="#0A162F" stroke="#0066FF" stroke-width="1.5" filter="url(#aiGlow)" />
    
    <!-- Top Bar -->
    <rect width="640" height="50" rx="16" fill="#0E1E40" />
    <circle cx="35" cy="25" r="10" fill="url(#nodeGrad)" />
    <text x="55" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">OPTIFLOW AI</text>
    <rect x="170" y="15" width="130" height="22" rx="11" fill="#060E20" />
    <circle cx="182" cy="26" r="4" fill="#00E676" />
    <text x="194" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#A3BADB">Neural Engine Active</text>

    <!-- Stat Pills on Right of Topbar -->
    <rect x="490" y="14" width="130" height="24" rx="6" fill="#0066FF" opacity="0.85" />
    <text x="505" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Auto-Sync 99.8%</text>

    <!-- Main Content Area -->
    <!-- Left Column: Workflow Graph Nodes -->
    <g transform="translate(25, 70)">
      <rect width="360" height="275" rx="12" fill="#060E20" stroke="#162B54" stroke-width="1" />
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Automated Customer Pipeline</text>
      
      <!-- Flow Node 1 -->
      <rect x="25" y="55" width="135" height="55" rx="8" fill="#0E2145" stroke="#00D2FF" stroke-width="1" />
      <text x="35" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">Omnichannel Lead</text>
      <text x="35" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#758EB8">WhatsApp, Web, Email</text>

      <!-- Connecting Arrow 1 -->
      <line x1="160" y1="82" x2="200" y2="82" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4, 3" />

      <!-- Flow Node 2 -->
      <rect x="200" y="55" width="135" height="55" rx="8" fill="#142B59" stroke="#0066FF" stroke-width="1" />
      <text x="210" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AI NLP Classifier</text>
      <text x="210" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#00D2FF">Intent &amp; Language Check</text>

      <!-- Connecting Downward Line -->
      <path d="M267 110 L267 145 L115 145 L115 160" stroke="#00D2FF" stroke-width="2" fill="none" stroke-dasharray="4, 3" />

      <!-- Flow Node 3 -->
      <rect x="40" y="160" width="150" height="55" rx="8" fill="#142B59" stroke="#7B2CBF" stroke-width="1" />
      <text x="50" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Smart CRM Sync</text>
      <text x="50" y="199" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D08E5F">Auto-Schedule / Quote</text>

      <!-- Connecting Line to Node 4 -->
      <line x1="190" y1="187" x2="215" y2="187" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4, 3" />

      <!-- Flow Node 4 -->
      <rect x="215" y="160" width="130" height="55" rx="8" fill="#0B3036" stroke="#00E676" stroke-width="1" />
      <text x="225" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00E676">WhatsApp Alert</text>
      <text x="225" y="199" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#A3BADB">Instant Notification</text>

      <!-- Execution Status Bar -->
      <rect x="25" y="235" width="310" height="24" rx="6" fill="#0D1E3F" />
      <text x="35" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#00D2FF">Speed: 210ms</text>
      <text x="140" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Cost Reduction: 68%</text>
      <text x="275" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#00E676">Live</text>
    </g>

    <!-- Right Column: Metrics & Chat preview -->
    <g transform="translate(405, 70)">
      <rect width="210" height="130" rx="12" fill="#060E20" stroke="#162B54" stroke-width="1" />
      <text x="15" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#8FA6CC">AUTOMATED INTERACTIONS</text>
      <text x="15" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">14,892</text>
      <text x="15" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#00E676">↑ +42% vs Manual Support</text>

      <!-- Sparkline Graph -->
      <path d="M15 115 L45 105 L85 110 L125 90 L165 98 L195 82" fill="none" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />

      <!-- Bot Mini Card -->
      <rect y="145" width="210" height="120" rx="12" fill="#0C1B38" stroke="#0066FF" stroke-width="1" />
      <circle cx="28" cy="172" r="12" fill="#00D2FF" />
      <text x="48" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AI Agent: Shoaib AI</text>
      <rect x="15" y="196" width="180" height="28" rx="6" fill="#061022" />
      <text x="24" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#CBD8EA">"Lead qualified for Web Dev pkg."</text>
      <rect x="15" y="232" width="110" height="20" rx="4" fill="#0066FF" />
      <text x="24" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Send WhatsApp</text>
    </g>
  </g>
</svg>
