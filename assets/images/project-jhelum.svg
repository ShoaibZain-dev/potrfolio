<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="50%" stop-color="#0E2142" />
      <stop offset="100%" stop-color="#040913" />
    </linearGradient>
    <filter id="jhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#jhBg)" />
  <circle cx="680" cy="400" r="180" fill="#00D2FF" opacity="0.1" filter="url(#jhGlow)" />

  <g transform="translate(90, 50)">
    <!-- Main Board -->
    <rect width="620" height="380" rx="16" fill="#09152B" stroke="#0066FF" stroke-width="1.5" filter="url(#jhGlow)" />
    
    <!-- Top Ribbon -->
    <path d="M0 16 C0 7 7 0 16 0 L604 0 C613 0 620 7 620 16 L620 48 L0 48 Z" fill="#0F2247" />
    <text x="25" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#00D2FF">JHELUM EATS &amp; GRILL</text>
    <rect x="420" y="14" width="180" height="24" rx="12" fill="#071224" />
    <circle cx="434" cy="26" r="4" fill="#00E676" />
    <text x="445" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#CBD8EA">Online Ordering System Live</text>

    <!-- Left Side: Digital QR Menu & Mobile Mockup -->
    <g transform="translate(30, 75)">
      <!-- Phone Mockup -->
      <rect width="180" height="270" rx="20" fill="#050C1A" stroke="#00D2FF" stroke-width="2" />
      <rect x="55" y="8" width="70" height="12" rx="6" fill="#0F2247" />
      <!-- Phone Screen -->
      <rect x="10" y="28" width="160" height="230" rx="12" fill="#0E1E3C" />
      <text x="22" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Special Shinwari Tikka</text>
      <text x="22" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#00D2FF">PKR 1,450 • Free Jhelum Delivery</text>
      <rect x="22" y="80" width="136" height="55" rx="6" fill="#18315E" />
      <text x="32" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#CBD8EA">WhatsApp Instant Order</text>
      <rect x="22" y="145" width="136" height="30" rx="6" fill="#25D366" />
      <text x="40" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Order via WhatsApp</text>
      <rect x="22" y="185" width="136" height="55" rx="6" fill="#14274B" />
      <text x="30" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8FA6CC">Google Reviews 4.9 ★</text>
      <text x="30" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#00D2FF">Civil Lines, Jhelum</text>
    </g>

    <!-- Right Side: Digital Impact & Stats -->
    <g transform="translate(240, 75)">
      <!-- Google Maps / Local SEO Badge -->
      <rect width="350" height="75" rx="10" fill="#0E1D3B" stroke="#1B3666" stroke-width="1" />
      <circle cx="40" cy="38" r="18" fill="#0066FF" />
      <text x="36" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">G</text>
      <text x="70" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Google Maps &amp; Local Business Ranking</text>
      <text x="70" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8FA6CC">#1 Ranking in Jhelum food searches</text>

      <!-- Revenue Growth Badge -->
      <rect y="92" width="350" height="75" rx="10" fill="#0E1D3B" stroke="#1B3666" stroke-width="1" />
      <circle cx="40" cy="130" r="18" fill="#00D2FF" />
      <text x="33" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#061226">↑</text>
      <text x="70" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">+280% Delivery Orders</text>
      <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#00E676">Direct WhatsApp orders with zero commission</text>

      <!-- Local Features Grid -->
      <g transform="translate(0, 185)">
        <rect width="168" height="70" rx="8" fill="#081429" stroke="#162D55" stroke-width="1" />
        <text x="14" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">Urdu &amp; English Menu</text>
        <text x="14" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8FA6CC">Customer-friendly mobile interface</text>

        <rect x="182" width="168" height="70" rx="8" fill="#081429" stroke="#162D55" stroke-width="1" />
        <text x="196" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00D2FF">Social Media Kit</text>
        <text x="196" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8FA6CC">Daily Facebook &amp; Insta banners</text>
      </g>
    </g>
  </g>
</svg>
