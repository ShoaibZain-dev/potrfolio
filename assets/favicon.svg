<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0B1B3D" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#060E20" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" />
  
  <!-- Stylized Geometric 'S' & Tech Nodes -->
  <path d="M44 20 C44 15.5 40 13 32 13 C22 13 18 17.5 18 22 C18 28 26 30 34 32 C41 34 46 37 46 43 C46 49.5 40.5 53 31 53 C21 53 17 48 17 43" 
        fill="none" 
        stroke="url(#favGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon)" />
  
  <!-- Accent Tech Dots -->
  <circle cx="44" cy="20" r="3.5" fill="#00D2FF" />
  <circle cx="17" cy="43" r="3.5" fill="#0066FF" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
</svg>
